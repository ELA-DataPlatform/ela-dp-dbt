version: 2

models:

  # ────────────────────────────────────────────────────────────────────────────
  - name: mart_homepage_running
    description: >
      Running distances for the last 14 rolling days (J-13 to today, Europe/Paris).
      One row per day. Days without any run have distance_km = 0.
      Includes ISO-week totals (current week vs previous week) repeated on every row.
    columns:
      - name: activity_date
        description: Calendar date (Europe/Paris).
        tests:
          - not_null
          - unique
      - name: day_label
        description: Day label formatted as "D/M" (e.g. "28/4"), no leading zeros.
        tests:
          - not_null
      - name: day_letter
        description: French initial of the day of week — L/M/M/J/V/S/D.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['L', 'M', 'J', 'V', 'S', 'D']
      - name: distance_km
        description: Total running distance on this day in kilometres. 0 if no activity.
        tests:
          - not_null
      - name: is_current_week
        description: True if the date belongs to the current ISO week.
        tests:
          - not_null
      - name: current_week_km
        description: Total km run during the current ISO week (repeated on every row).
        tests:
          - not_null
      - name: previous_week_km
        description: Total km run during the previous ISO week (repeated on every row).
        tests:
          - not_null

  # ────────────────────────────────────────────────────────────────────────────
  - name: mart_homepage_last_activity
    description: >
      The most recent running activity (running / trail_running / treadmill_running).
      Always exactly one row, ordered by activity_date DESC then start_time_local DESC.
    columns:
      - name: activity_id
        description: Garmin activity identifier as a string.
        tests:
          - not_null
      - name: activity_name
        description: Display name of the activity as entered on the device.
      - name: activity_date
        description: Calendar date of the activity (local timezone).
        tests:
          - not_null
      - name: activity_date_label
        description: Human-readable date in French, e.g. "3 mai 2026".
        tests:
          - not_null
      - name: days_ago
        description: Number of calendar days between the activity date and today (Europe/Paris).
        tests:
          - not_null
      - name: distance_km
        description: Distance in kilometres rounded to 2 decimal places.
        tests:
          - not_null
      - name: duration_seconds
        description: Elapsed duration of the activity in seconds.
        tests:
          - not_null
      - name: duration_label
        description: Human-readable duration — "Xh YY" for >= 1 h, "YY min" otherwise.
        tests:
          - not_null
      - name: pace_seconds_per_km
        description: Average pace in seconds per kilometre.
      - name: pace_label
        description: Average pace formatted as M'SS"/km (e.g. 5'12"/km).
      - name: avg_heart_rate_bpm
        description: Average heart rate during the activity in BPM.
      - name: elevation_gain_m
        description: Total positive elevation gain in metres.
      - name: polyline
        description: >
          GPS polyline (Google encoded format or JSON array [[lat,lng],...]).
          Currently NULL — not available from the lake tables; fetch from the Garmin
          activity details API if needed.

  # ────────────────────────────────────────────────────────────────────────────
  - name: mart_homepage_health
    description: >
      Daily sleep and recovery metrics for the last 10 rolling days (J-9 to today,
      Europe/Paris). One row per day. Missing days have NULL metrics.
      Aggregate columns (avg_*, delta_*) are repeated on every row and reflect
      the most recent day with data vs. the preceding days in the window.
    columns:
      - name: activity_date
        description: Calendar date (Europe/Paris).
        tests:
          - not_null
          - unique
      - name: day_label
        description: Day label formatted as "D/M", no leading zeros.
        tests:
          - not_null
      - name: sleep_score
        description: Garmin sleep overall score (0–100). NULL if not recorded.
      - name: sleep_duration_minutes
        description: Total sleep duration in minutes.
      - name: hrv_morning_ms
        description: Average overnight HRV in milliseconds.
      - name: body_battery_at_sleep
        description: Body battery level at sleep start (0–100).
      - name: body_battery_at_wake
        description: Body battery level at wake-up (0–100).
      - name: avg_sleep_score
        description: Average sleep score over the preceding days in the 10-day window.
      - name: avg_sleep_duration_minutes
        description: Average sleep duration in minutes over the preceding days.
      - name: avg_hrv_ms
        description: Average overnight HRV over the preceding days.
      - name: avg_body_battery_wake
        description: Average body battery at wake-up over the preceding days.
      - name: delta_sleep_score
        description: Sleep score delta — most recent day minus preceding average.
      - name: delta_sleep_score_tone
        description: Tone label for the sleep score delta.
        tests:
          - accepted_values:
              arguments:
                values: ['success', 'warning', 'danger', 'neutral']
      - name: delta_sleep_minutes
        description: Sleep duration delta in minutes — most recent day minus preceding average.
      - name: delta_hrv_ms
        description: HRV delta — most recent day minus preceding average.
      - name: delta_body_battery
        description: Body battery at wake-up delta — most recent day minus preceding average.
      - name: delta_body_battery_tone
        description: Tone label for the body battery delta.
        tests:
          - accepted_values:
              arguments:
                values: ['success', 'warning', 'danger', 'neutral']

  # ────────────────────────────────────────────────────────────────────────────
  - name: mart_homepage_training_state
    description: >
      Snapshot of the current training state, VO2 max, and training load.
      Always exactly one row — the most recent entry from svc_garmin__training_status.
    columns:
      - name: snapshot_date
        description: Date of the training status snapshot.
        tests:
          - not_null
      - name: training_state
        description: Normalised training state label derived from Garmin feedback phrase.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['detraining', 'recovery', 'productive', 'maintaining', 'overreaching']
      - name: vo2_max
        description: Most recent VO2 max estimate (precise value if available).
      - name: vo2_max_status
        description: VO2 max trend vs the previous measurement.
        tests:
          - accepted_values:
              arguments:
                values: ['stable', 'improving', 'declining']
      - name: training_load_7d
        description: Acute (7-day rolling) training load score.
      - name: training_load_target_low
        description: Lower bound of the optimal chronic training load range.
      - name: training_load_target_high
        description: Upper bound of the optimal chronic training load range.
      - name: active_goal_name
        description: Name of the active race goal (NULL — not available in lake data).
      - name: active_goal_date
        description: Date of the active race goal (NULL — not available in lake data).
      - name: active_goal_days_left
        description: Days remaining until the active goal (NULL — not available in lake data).

  # ────────────────────────────────────────────────────────────────────────────
  - name: mart_homepage_music_trend
    description: >
      Daily Spotify listening time for the last 10 rolling days (J-9 to today,
      Europe/Paris). One row per day. Days with no streams have listening_minutes = 0.
      Aggregate columns (total_*, delta_*) are repeated on every row.
    columns:
      - name: stream_date
        description: Calendar date (Europe/Paris).
        tests:
          - not_null
          - unique
      - name: day_label
        description: Day label formatted as "D/M", no leading zeros.
        tests:
          - not_null
      - name: listening_minutes
        description: Total listening time in minutes on this day. 0 if no streams.
        tests:
          - not_null
      - name: total_minutes_10d
        description: Total listening minutes over the full 10-day current period.
        tests:
          - not_null
      - name: total_label
        description: Formatted total — "XhYY" (e.g. "9h12").
        tests:
          - not_null
      - name: total_minutes_prev_10d
        description: Total listening minutes for the previous 10-day period (J-19 to J-10).
        tests:
          - not_null
      - name: delta_pct
        description: >
          Percentage change between current and previous 10-day period.
          NULL if previous period had 0 minutes.
      - name: delta_tone
        description: Tone label for the listening trend.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['success', 'danger', 'neutral']

  # ────────────────────────────────────────────────────────────────────────────
  - name: mart_homepage_music_rankings
    description: >
      Top 5 artists, albums, and tracks ranked by listening time over the last
      10 days (J-9 to today, Europe/Paris), with rank change vs the previous
      10-day period (J-19 to J-10).
      15 rows total (5 per ranking_type).
    columns:
      - name: period_start
        description: Start date of the current ranking period (J-9).
        tests:
          - not_null
      - name: period_end
        description: End date of the current ranking period (today).
        tests:
          - not_null
      - name: ranking_type
        description: Entity type being ranked.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['artist', 'album', 'track']
      - name: rank
        description: Rank within the ranking_type (1 = most listened).
        tests:
          - not_null
      - name: name
        description: Name of the artist, album, or track.
        tests:
          - not_null
      - name: subtitle
        description: Primary artist name (for album and track). NULL for artist.
      - name: listening_minutes
        description: Total listening minutes in the current period.
        tests:
          - not_null
      - name: listening_label
        description: Human-readable duration — "XhYY" for >= 60 min, "YYmin" otherwise.
        tests:
          - not_null
      - name: image_url
        description: >
          Cover art URL from the Spotify CDN.
          Artist → artist image; album → album cover; track → album cover.
      - name: rank_change
        description: >
          Rank movement vs the previous period: "+2", "-1", "0", or "new"
          if absent from top 5 in the previous period.
        tests:
          - not_null
