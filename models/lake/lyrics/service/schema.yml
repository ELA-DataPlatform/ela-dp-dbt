version: 2

models:
  - name: svc_lyrics__lyrics
    description: >
      Incremental service table for lyrics data. One row per track_id.
      Merges new data from stg_lyrics__lyrics on each run.
    columns:
      - name: track_id
        description: Spotify unique track identifier.
        tests:
          - unique
          - not_null
      - name: track_name
        description: Track name used for the lyrics lookup.
      - name: artist_name
        description: Artist name used for the lyrics lookup.
      - name: album_name
        description: Album name used for the lyrics lookup.
      - name: duration_s
        description: Track duration in seconds.
      - name: found
        description: Whether lyrics were found for this track.
      - name: lrclib_id
        description: LRCLIB unique identifier for the lyrics entry.
      - name: instrumental
        description: Whether the track is instrumental.
      - name: plain_lyrics
        description: Plain text lyrics content.
      - name: fetched_at
        description: Timestamp when the lyrics were fetched from LRCLIB.
      - name: _ingested_at
        description: Timestamp of the most recent ingestion batch.
        tests:
          - not_null
