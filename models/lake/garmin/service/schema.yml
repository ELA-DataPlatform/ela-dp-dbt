version: 2

models:
  # ── GROUP 1: Simple tables ──────────────────────────────────────────────

  - name: svc_garmin__activities
    description: >
      Service table for Garmin activities. Incrementally merges new data
      from staging, ensuring uniqueness on activityId.
    columns:
      - name: activityId
        description: Garmin unique activity identifier.
      - name: _ingested_at
        description: Timestamp when the record was ingested.

  - name: svc_garmin__activity_details
    description: >
      Service table for detailed activity data including GPS metrics.
      Incrementally merges from staging, ensuring uniqueness on activityId.
    columns:
      - name: activityId
        description: Garmin unique activity identifier.
      - name: _ingested_at
        description: Timestamp when the record was ingested.

  - name: svc_garmin__body_composition
    description: >
      Service table for body composition measurements.
      Incrementally merges from staging, ensuring uniqueness on date + samplePk.
    columns:
      - name: date
        description: Date of the measurement.
      - name: samplePk
        description: Sample primary key.
      - name: _ingested_at
        description: Timestamp when the record was ingested.

  - name: svc_garmin__race_predictions
    description: >
      Service table for race predictions.
      Incrementally merges from staging, ensuring uniqueness on userId + calendarDate.
    columns:
      - name: userId
        description: Garmin user identifier.
      - name: calendarDate
        description: Date of the prediction.
      - name: _ingested_at
        description: Timestamp when the record was ingested.

  - name: svc_garmin__steps
    description: >
      Service table for step count data.
      Incrementally merges from staging, ensuring uniqueness on date + startGMT.
    columns:
      - name: date
        description: Date of the step data.
      - name: startGMT
        description: Start timestamp of the step interval.
      - name: _ingested_at
        description: Timestamp when the record was ingested.

  - name: svc_garmin__all_day_events
    description: >
      Service table for all-day activity events.
      Incrementally merges from staging, ensuring uniqueness on deviceId + date + startTimestampGMT.
    columns:
      - name: deviceId
        description: Garmin device identifier.
      - name: date
        description: Date of the event.
      - name: startTimestampGMT
        description: Start timestamp of the event.
      - name: _ingested_at
        description: Timestamp when the record was ingested.

  - name: svc_garmin__weight
    description: >
      Service table for weight measurements.
      Incrementally merges from staging, ensuring uniqueness on date + timestampGMT.
    columns:
      - name: date
        description: Date of the weight measurement.
      - name: timestampGMT
        description: GMT timestamp of the measurement.
      - name: _ingested_at
        description: Timestamp when the record was ingested.

  - name: svc_garmin__training_readiness
    description: >
      Service table for training readiness scores.
      Incrementally merges from staging, ensuring uniqueness on userProfilePK + date.
    columns:
      - name: userProfilePK
        description: Garmin user profile identifier.
      - name: date
        description: Date of the training readiness data.
      - name: _ingested_at
        description: Timestamp when the record was ingested.

  # ── GROUP 2: Timeseries tables ──────────────────────────────────────────

  - name: svc_garmin__heart_rate
    description: >
      Service table for daily heart rate data.
      Incrementally merges from staging, ensuring uniqueness on userProfilePK + date.
    columns:
      - name: userProfilePK
        description: Garmin user profile identifier.
      - name: date
        description: Date of the heart rate data.
      - name: _ingested_at
        description: Timestamp when the record was ingested.

  - name: svc_garmin__stress
    description: >
      Service table for daily stress data.
      Incrementally merges from staging, ensuring uniqueness on userProfilePK + date.
    columns:
      - name: userProfilePK
        description: Garmin user profile identifier.
      - name: date
        description: Date of the stress data.
      - name: _ingested_at
        description: Timestamp when the record was ingested.

  - name: svc_garmin__respiration
    description: >
      Service table for daily respiration data.
      Incrementally merges from staging, ensuring uniqueness on userProfilePK + date.
    columns:
      - name: userProfilePK
        description: Garmin user profile identifier.
      - name: date
        description: Date of the respiration data.
      - name: _ingested_at
        description: Timestamp when the record was ingested.

  - name: svc_garmin__spo2
    description: >
      Service table for daily SpO2 data.
      Incrementally merges from staging, ensuring uniqueness on userProfilePK + date.
    columns:
      - name: userProfilePK
        description: Garmin user profile identifier.
      - name: date
        description: Date of the SpO2 data.
      - name: _ingested_at
        description: Timestamp when the record was ingested.

  - name: svc_garmin__intensity_minutes
    description: >
      Service table for daily intensity minutes.
      Incrementally merges from staging, ensuring uniqueness on userProfilePK + date.
    columns:
      - name: userProfilePK
        description: Garmin user profile identifier.
      - name: date
        description: Date of the intensity minutes data.
      - name: _ingested_at
        description: Timestamp when the record was ingested.

  - name: svc_garmin__floors
    description: >
      Service table for daily floors data.
      Incrementally merges from staging, ensuring uniqueness on date.
    columns:
      - name: date
        description: Date of the floors data.
      - name: _ingested_at
        description: Timestamp when the record was ingested.

  - name: svc_garmin__body_battery
    description: >
      Service table for daily body battery data with parsed feedback events.
      Incrementally merges from staging, ensuring uniqueness on date.
    columns:
      - name: date
        description: Date of the body battery data.
      - name: _ingested_at
        description: Timestamp when the record was ingested.

  # ── GROUP 3: JSON object tables ─────────────────────────────────────────

  - name: svc_garmin__sleep
    description: >
      Service table for comprehensive sleep data with parsed sleep summary
      and SpO2 summary. Incrementally merges from staging on date.
    columns:
      - name: date
        description: Date of the sleep data.
      - name: _ingested_at
        description: Timestamp when the record was ingested.

  - name: svc_garmin__hrv
    description: >
      Service table for HRV data with parsed summary metrics.
      Incrementally merges from staging on userProfilePk + date.
    columns:
      - name: userProfilePk
        description: Garmin user profile identifier.
      - name: date
        description: Date of the HRV data.
      - name: _ingested_at
        description: Timestamp when the record was ingested.

  - name: svc_garmin__max_metrics
    description: >
      Service table for max metrics with parsed VO2 max and acclimation data.
      Incrementally merges from staging on userId + date.
    columns:
      - name: userId
        description: Garmin user identifier.
      - name: date
        description: Date of the max metrics data.
      - name: _ingested_at
        description: Timestamp when the record was ingested.

  - name: svc_garmin__training_status
    description: >
      Service table for training status with parsed VO2 max fields.
      Incrementally merges from staging on userId + date.
    columns:
      - name: userId
        description: Garmin user identifier.
      - name: date
        description: Date of the training status data.
      - name: _ingested_at
        description: Timestamp when the record was ingested.

  - name: svc_garmin__endurance_score
    description: >
      Service table for endurance score with parsed score and classification.
      Incrementally merges from staging on userProfilePK + startDate.
    columns:
      - name: userProfilePK
        description: Garmin user profile identifier.
      - name: startDate
        description: Start date of the endurance score period.
      - name: _ingested_at
        description: Timestamp when the record was ingested.

  - name: svc_garmin__hill_score
    description: >
      Service table for hill score data.
      Incrementally merges from staging on userProfilePK + startDate.
    columns:
      - name: userProfilePK
        description: Garmin user profile identifier.
      - name: startDate
        description: Start date of the hill score period.
      - name: _ingested_at
        description: Timestamp when the record was ingested.

  - name: svc_garmin__rhr_daily
    description: >
      Service table for daily resting heart rate with parsed RHR value.
      Incrementally merges from staging on userProfileId + date.
    columns:
      - name: userProfileId
        description: Garmin user profile identifier.
      - name: date
        description: Date of the RHR data.
      - name: _ingested_at
        description: Timestamp when the record was ingested.

  # ── GROUP 4: Activity sub-tables ────────────────────────────────────────

  - name: svc_garmin__activity_exercise_sets
    description: >
      Service table for exercise sets data.
      Incrementally merges from staging, ensuring uniqueness on activityId.
    columns:
      - name: activityId
        description: Garmin unique activity identifier.
      - name: _ingested_at
        description: Timestamp when the record was ingested.

  - name: svc_garmin__activity_hr_zones
    description: >
