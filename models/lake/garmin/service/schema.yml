      Incrementally merges from staging, ensuring uniqueness on activityId.
    columns:
      - name: activityId
        description: Garmin unique activity identifier.
      - name: _ingested_at
        description: Timestamp when the record was ingested.

  - name: svc_garmin__activity_splits
    description: >
      Service table for activity split/lap data.
      Incrementally merges from staging, ensuring uniqueness on activityId.
    columns:
      - name: activityId
        description: Garmin unique activity identifier.
      - name: _ingested_at
        description: Timestamp when the record was ingested.

  - name: svc_garmin__activity_weather
    description: >
      Service table for activity weather with parsed weather fields.
      Incrementally merges from staging, ensuring uniqueness on activityId.
    columns:
      - name: activityId
        description: Garmin unique activity identifier.
      - name: _ingested_at
        description: Timestamp when the record was ingested.

  # ── GROUP 5: Large scalar tables ────────────────────────────────────────

  - name: svc_garmin__stats_and_body
    description: >
      Service table for comprehensive daily wellness summary (~154 fields).
      Incrementally merges from staging on userProfileId + date.
    columns:
      - name: userProfileId
        description: Garmin user profile identifier.
      - name: date
        description: Date of the summary.
      - name: _ingested_at
        description: Timestamp when the record was ingested.

  - name: svc_garmin__user_summary
    description: >
      Service table for daily user wellness summary (~152 fields).
      Incrementally merges from staging on userProfileId + date.
    columns:
      - name: userProfileId
        description: Garmin user profile identifier.
      - name: date
        description: Date of the summary.
      - name: _ingested_at
