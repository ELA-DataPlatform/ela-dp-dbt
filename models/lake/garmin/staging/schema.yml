version: 2

models:
  # ── GROUP 1: Simple tables (no JSON parsing) ────────────────────────────

  - name: stg_garmin__activities
    description: >
      Deduplicated view of raw Garmin activity data. Contains scalar fields covering
      distance, duration, calories, heart rate, elevation, power, and cadence.
      JSON fields (activityType, eventType, privacy, userRoles, splitSummaries) are
      parsed into typed STRUCTs and ARRAYs.
    columns:
      - name: activityId
        description: Garmin unique activity identifier.
      - name: activity_type
        description: >
          Parsed STRUCT from activityType JSON. Contains type_id, type_key,
          parent_type_id, is_hidden, restricted, trimmable.
      - name: event_type
        description: >
          Parsed STRUCT from eventType JSON. Contains type_id, type_key, sort_order.
      - name: privacy
        description: >
          Parsed STRUCT from privacy JSON. Contains type_id, type_key.
      - name: user_roles
        description: Parsed ARRAY<STRING> of Garmin OAuth scope roles assigned to the user.
      - name: split_summaries
        description: >
          Parsed ARRAY<STRUCT> from splitSummaries JSON. Each element contains
          split_type, no_of_splits, distance, duration, total_ascent, elevation_loss,
          average_speed, max_speed, max_elevation_gain, average_elevation_gain,
          max_distance, num_climb_sends, num_falls.
      - name: _ingested_at
        description: Timestamp when the record was ingested.

  - name: stg_garmin__activity_details
    description: >
      Deduplicated view of detailed activity data. JSON fields (activityTypeDTO,
      eventTypeDTO, timeZoneUnitDTO, accessControlRuleDTO, splitSummaries,
      summarizedExerciseSets) are parsed into typed STRUCTs and ARRAYs.
      Extra fields from summaryDTO and metadataDTO not present as flat columns
      are extracted individually. detailed_data (GPS timeseries) is kept as raw JSON.
    columns:
      - name: activityId
        description: Garmin unique activity identifier.
      - name: activity_type
        description: >
          Parsed STRUCT from activityTypeDTO JSON. Contains type_id, type_key,
          parent_type_id, is_hidden, restricted, trimmable.
      - name: event_type
        description: >
          Parsed STRUCT from eventTypeDTO JSON. Contains type_id, type_key, sort_order.
      - name: time_zone_unit
        description: >
          Parsed STRUCT from timeZoneUnitDTO JSON. Contains unit_id, unit_key, time_zone.
      - name: access_control_rule
        description: >
          Parsed STRUCT from accessControlRuleDTO JSON. Contains type_id, type_key.
      - name: split_summaries
        description: >
          Parsed ARRAY<STRUCT> from splitSummaries JSON. Each element contains
          split_type, no_of_splits, distance, duration, total_ascent, elevation_loss,
          average_speed, max_speed, max_elevation_gain, average_elevation_gain,
          max_distance, num_climb_sends, num_falls.
      - name: summarized_exercise_sets
        description: >
          Parsed ARRAY<STRUCT> from summarizedExerciseSets JSON. Each element contains
          category, sets, reps, duration_ms, volume, max_weight_g.
      - name: min_hr
        description: Minimum heart rate during the activity (from summaryDTO).
      - name: average_moving_speed
        description: Average speed while actually moving, excluding stops (from summaryDTO).
      - name: average_temperature
        description: Average ambient temperature during the activity in Celsius (from summaryDTO).
      - name: workout_feel
        description: Garmin perceived effort score (0-100) recorded at end of activity (from summaryDTO).
      - name: workout_rpe
        description: Rate of perceived exertion score recorded at end of activity (from summaryDTO).
      - name: total_work_kj
        description: Total mechanical work done during the activity in kilojoules (from summaryDTO).
      - name: begin_potential_stamina
        description: Garmin stamina percentage at the start of the activity (from summaryDTO).
      - name: end_potential_stamina
        description: Garmin stamina percentage at the end of the activity (from summaryDTO).
      - name: min_available_stamina
        description: Minimum available stamina percentage reached during the activity (from summaryDTO).
      - name: min_power
        description: Minimum power output in watts during the activity (from summaryDTO).
      - name: last_update_date
        description: Timestamp of the last update to this activity record (from metadataDTO).
      - name: uploaded_date
        description: Timestamp when this activity was uploaded to Garmin Connect (from metadataDTO).
      - name: file_format_key
        description: File format of the original activity file, e.g. fit (from metadataDTO).
      - name: has_intensity_intervals
        description: Whether the activity contains intensity interval segments (from metadataDTO).
      - name: has_run_power_wind_data
        description: Whether the activity contains run power with wind data (from metadataDTO).
      - name: detailed_data
        description: JSON string with GPS tracks and granular metric timeseries (~2s resolution).
      - name: _ingested_at
        description: Timestamp when the record was ingested.

  - name: stg_garmin__body_composition
    description: >
      Deduplicated view of body composition measurements (weight, body fat, BMI,
      muscle mass, bone mass, body water, visceral fat).
    columns:
      - name: date
        description: Date of the measurement.
      - name: samplePk
        description: Sample primary key for the measurement.
      - name: _ingested_at
        description: Timestamp when the record was ingested.

  - name: stg_garmin__race_predictions
    description: >
      Deduplicated view of predicted race times for 5K, 10K, half marathon, and marathon.
    columns:
      - name: userId
        description: Garmin user identifier.
      - name: calendarDate
        description: Date of the prediction.
      - name: _ingested_at
        description: Timestamp when the record was ingested.

  - name: stg_garmin__steps
    description: >
      Deduplicated view of step count data. Handles two formats from the Garmin API:
      intraday rows (startGMT populated, steps per time window) and daily summary rows
      (startGMT NULL, totalSteps for the full day). A step_key surrogate is added to
      allow correct MERGE deduplication regardless of NULL startGMT.
    columns:
      - name: step_key
        description: >
          Surrogate key built from date and startGMT (or 'DAILY' when NULL).
          Used as the unique key for MERGE in the service layer to avoid duplicates
          when startGMT is NULL (NULL = NULL is false in SQL joins).
      - name: date
        description: Date of the step data.
      - name: totalSteps
        description: Total step count for the day.
      - name: stepGoal
        description: Daily step goal set on the device.
      - name: totalDistance
        description: Total distance covered (in meters).
      - name: startGMT
        description: >
          Start timestamp of the intraday time window. NULL for daily summary rows.
      - name: endGMT
        description: >
          End timestamp of the intraday time window. NULL for daily summary rows.
      - name: steps
        description: >
          Step count for the intraday time window. NULL for daily summary rows.
      - name: primaryActivityLevel
        description: Primary activity level classification for the time window.
      - name: _ingested_at
        description: Timestamp when the record was ingested.

  - name: stg_garmin__all_day_events
    description: >
      Deduplicated view of all-day activity events (vigorous/moderate intensity minutes blocks).
    columns:
      - name: deviceId
        description: Garmin device identifier.
      - name: date
        description: Date of the event.
      - name: startTimestampGMT
        description: Start timestamp of the event.
      - name: _ingested_at
        description: Timestamp when the record was ingested.

  - name: stg_garmin__weight
    description: >
      Deduplicated view of weight and body composition measurements from the scale.
    columns:
      - name: date
        description: Date of the weight measurement.
      - name: timestampGMT
        description: GMT timestamp of the measurement.
      - name: _ingested_at
        description: Timestamp when the record was ingested.

  - name: stg_garmin__training_readiness
    description: >
      Deduplicated view of training readiness scores with contributing factors
      (sleep, HRV, stress history, recovery time).
    columns:
      - name: userProfilePK
        description: Garmin user profile identifier.
      - name: date
        description: Date of the training readiness data.
      - name: _ingested_at
        description: Timestamp when the record was ingested.

  # ── GROUP 2: Timeseries tables (arrays kept as-is) ──────────────────────

  - name: stg_garmin__heart_rate
    description: >
      Deduplicated view of daily heart rate data. Scalar summary fields
      (resting/max/min HR) are directly accessible. Timeseries arrays kept as JSON strings.
    columns:
      - name: userProfilePK
        description: Garmin user profile identifier.
      - name: date
        description: Date of the heart rate data.
      - name: _ingested_at
        description: Timestamp when the record was ingested.

  - name: stg_garmin__stress
    description: >
      Deduplicated view of daily stress data. Scalar fields (avg/max stress level)
      directly accessible. Timeseries arrays kept as JSON strings.
    columns:
      - name: userProfilePK
        description: Garmin user profile identifier.
      - name: date
        description: Date of the stress data.
      - name: _ingested_at
        description: Timestamp when the record was ingested.

  - name: stg_garmin__respiration
    description: >
      Deduplicated view of daily respiration data. Scalar fields (avg sleep/waking respiration)
      directly accessible. Timeseries arrays kept as JSON strings.
    columns:
      - name: userProfilePK
        description: Garmin user profile identifier.
      - name: date
        description: Date of the respiration data.
      - name: _ingested_at
        description: Timestamp when the record was ingested.

  - name: stg_garmin__spo2
    description: >
      Deduplicated view of daily SpO2 data. Scalar fields (avg/latest/lowest SpO2)
      directly accessible. Two mutually exclusive timeseries columns depending on data source:
      spo2_values (minute-level readings from spo2ValuesArray) and
      spo2_hourly_averages (hourly averages from spO2HourlyAverages).
    columns:
      - name: userProfilePK
        description: Garmin user profile identifier.
      - name: date
        description: Date of the SpO2 data.
      - name: spo2_values
        description: >
          ARRAY<STRUCT> parsed from spo2ValuesArray (minute-level readings).
          Each element: timestamp (INT64 ms), spo2_reading (INT64 %), reading_confidence (INT64).
          Mutually exclusive with spo2_hourly_averages.
      - name: spo2_hourly_averages
        description: >
          ARRAY<STRUCT> parsed from spO2HourlyAverages (hourly averages).
          Each element: timestamp (INT64 ms), value (INT64 %).
          Mutually exclusive with spo2_values.
      - name: _ingested_at
        description: Timestamp when the record was ingested.

  - name: stg_garmin__intensity_minutes
    description: >
      Deduplicated view of daily intensity minutes. Scalar fields (weekly goal/total,
      moderate/vigorous minutes) directly accessible.
    columns:
      - name: userProfilePK
        description: Garmin user profile identifier.
      - name: date
        description: Date of the intensity minutes data.
      - name: _ingested_at
        description: Timestamp when the record was ingested.

  - name: stg_garmin__floors
    description: >
      Deduplicated view of daily floors data. Floor values timeseries kept as JSON string.
    columns:
      - name: date
        description: Date of the floors data.
      - name: _ingested_at
        description: Timestamp when the record was ingested.

  - name: stg_garmin__body_battery
    description: >
      Deduplicated view of daily body battery data. Timeseries arrays kept as JSON strings.
      Dynamic feedback events parsed into flat columns.
    columns:
      - name: date
        description: Date of the body battery data.
      - name: dynamic_feedback_timestamp_gmt
        description: Timestamp of the dynamic feedback event.
      - name: dynamic_feedback_battery_level
        description: Body battery level at dynamic feedback event (e.g., HIGH, MEDIUM, LOW).
      - name: dynamic_feedback_short_type
        description: Short feedback type classification.
      - name: eod_feedback_timestamp_gmt
        description: Timestamp of the end-of-day feedback event.
      - name: eod_feedback_battery_level
        description: Body battery level at end-of-day feedback event.
      - name: eod_feedback_short_type
        description: End-of-day short feedback type classification.
      - name: _ingested_at
        description: Timestamp when the record was ingested.

  # ── GROUP 3: JSON object tables (parsed into typed columns) ─────────────

  - name: stg_garmin__sleep
    description: >
      Deduplicated view of comprehensive sleep data. dailySleepDTO and
      wellnessSpO2SleepSummaryDTO parsed into typed columns. Timeseries arrays
      (sleepLevels, sleepHeartRate, sleepStress, sleepRespiration, sleepSPO2, etc.)
      parsed into ARRAY<STRUCT>. wellnessEpochRespirationAveragesList parsed into
      sleep_respiration_averages (hourly averages with high/low bounds).
    columns:
      - name: date
        description: Date of the sleep data.
      - name: sleep_time_seconds
        description: Total sleep time in seconds.
      - name: deep_sleep_seconds
        description: Deep sleep duration in seconds.
      - name: light_sleep_seconds
        description: Light sleep duration in seconds.
      - name: rem_sleep_seconds
        description: REM sleep duration in seconds.
      - name: awake_sleep_seconds
        description: Awake time during sleep window in seconds.
      - name: sleep_overall_score
        description: Overall sleep score (0-100).
      - name: sleep_quality_key
        description: Sleep quality classification key.
      - name: spo2_sleep_avg
        description: Average SpO2 during sleep.
      - name: spo2_sleep_lowest
        description: Lowest SpO2 during sleep.
      - name: sleep_respiration_averages
        description: >
          ARRAY<STRUCT> parsed from wellnessEpochRespirationAveragesList.
          Each element covers one hour with epoch_end_timestamp_gmt (ms),
          respiration_average_value, respiration_high_value, respiration_low_value.
          A value of -2.0 on respiration_average_value indicates an unmeasured epoch.
      - name: _ingested_at
        description: Timestamp when the record was ingested.

  - name: stg_garmin__hrv
    description: >
      Deduplicated view of HRV data. hrvSummary parsed into typed columns
      (weekly avg, last night avg, baseline, status). hrvReadings kept as JSON string.
    columns:
      - name: userProfilePk
        description: Garmin user profile identifier.
      - name: date
        description: Date of the HRV data.
      - name: hrv_weekly_avg
        description: Weekly average HRV.
      - name: hrv_last_night_avg
        description: Last night average HRV.
      - name: hrv_last_night_5min_high
        description: Last night 5-minute high HRV.
      - name: hrv_baseline_balanced_low
        description: HRV baseline balanced low threshold.
      - name: hrv_baseline_balanced_upper
        description: HRV baseline balanced upper threshold.
      - name: hrv_status
        description: HRV status classification (BALANCED, LOW, etc.).
      - name: _ingested_at
        description: Timestamp when the record was ingested.

  - name: stg_garmin__max_metrics
    description: >
      Deduplicated view of max metrics. generic and heatAltitudeAcclimation
      JSON objects parsed into typed columns (VO2 max, acclimation data).
    columns:
      - name: userId
        description: Garmin user identifier.
      - name: date
        description: Date of the max metrics data.
      - name: vo2_max_precise
        description: Precise VO2 max value.
      - name: vo2_max
        description: Rounded VO2 max value.
      - name: altitude_acclimation
        description: Current altitude acclimation level.
      - name: heat_acclimation_pct
        description: Heat acclimation percentage.
      - name: _ingested_at
        description: Timestamp when the record was ingested.

  - name: stg_garmin__training_status
    description: >
      Deduplicated view of training status data. latestTrainingStatusData parsed
      by extracting the single device key dynamically, then flattening all fields
      including acuteTrainingLoadDTO into typed columns.
    columns:
      - name: userId
        description: Garmin user identifier.
      - name: date
        description: Date of the training status data.
      - name: device_id
        description: Garmin device identifier extracted from latestTrainingStatusData.
      - name: calendar_date
        description: Calendar date reported by the device.
      - name: since_date
        description: Start date of the current training status window.
      - name: training_status
        description: Numeric training status code (e.g. 7 = Productive).
      - name: sport
        description: Primary sport for this training status (e.g. RUNNING).
      - name: sub_sport
        description: Sub-sport classification.
      - name: fitness_trend_sport
        description: Sport used for fitness trend calculation.
      - name: fitness_trend
        description: Numeric fitness trend code.
      - name: training_status_feedback_phrase
        description: Feedback phrase key (e.g. PRODUCTIVE_5).
      - name: training_paused
        description: Whether training tracking is paused.
      - name: acwr_percent
        description: Acute:chronic workload ratio as a percentage.
      - name: acwr_status
        description: ACWR status category (e.g. LOW, OPTIMAL).
      - name: acwr_status_feedback
        description: ACWR feedback phrase key.
      - name: daily_training_load_acute
        description: Acute training load for the day.
      - name: daily_training_load_chronic
        description: Chronic training load for the day.
      - name: max_training_load_chronic
        description: Upper bound of the chronic training load tunnel.
      - name: min_training_load_chronic
        description: Lower bound of the chronic training load tunnel.
      - name: daily_acute_chronic_workload_ratio
        description: Raw acute/chronic workload ratio value.
      - name: _ingested_at
        description: Timestamp when the record was ingested.

  - name: stg_garmin__endurance_score
    description: >
      Deduplicated view of endurance score data. enduranceScoreDTO parsed into
      typed columns (score, classification, gauge limits). groupMap kept as JSON string.
    columns:
      - name: userProfilePK
        description: Garmin user profile identifier.
      - name: startDate
        description: Start date of the endurance score period.
      - name: endurance_overall_score
        description: Overall endurance score.
      - name: endurance_classification
        description: Endurance classification level.
      - name: endurance_contributors
        description: JSON array of score contributors.
      - name: _ingested_at
        description: Timestamp when the record was ingested.

  - name: stg_garmin__hill_score
    description: >
      Deduplicated view of hill score data. hillScoreDTOList kept as JSON array
      (contains multiple entries per row, parsing would change cardinality).
    columns:
      - name: userProfilePK
        description: Garmin user profile identifier.
      - name: startDate
        description: Start date of the hill score period.
      - name: _ingested_at
        description: Timestamp when the record was ingested.

  - name: stg_garmin__rhr_daily
    description: >
      Deduplicated view of daily resting heart rate. allMetrics JSON parsed
      to extract the resting heart rate value directly.
    columns:
      - name: userProfileId
        description: Garmin user profile identifier.
      - name: date
        description: Date of the RHR data.
      - name: resting_heart_rate
        description: Resting heart rate value extracted from allMetrics JSON.
      - name: rhr_calendar_date
        description: Calendar date associated with the RHR measurement.
      - name: _ingested_at
        description: Timestamp when the record was ingested.

  # ── GROUP 4: Activity sub-tables ────────────────────────────────────────

  - name: stg_garmin__activity_exercise_sets
    description: >
      Deduplicated view of exercise sets data for strength/workout activities.
      Exercise sets data kept as JSON string.
    columns:
      - name: activityId
        description: Garmin unique activity identifier.
      - name: _ingested_at
        description: Timestamp when the record was ingested.

  - name: stg_garmin__activity_hr_zones
    description: >
      Deduplicated view of heart rate zone distribution for activities.
      HR zones data kept as JSON array.
    columns:
      - name: activityId
        description: Garmin unique activity identifier.
      - name: _ingested_at
        description: Timestamp when the record was ingested.

  - name: stg_garmin__activity_splits
    description: >
      Deduplicated view of activity split/lap data. Split summaries,
      typed splits, and detailed laps kept as JSON strings.
    columns:
      - name: activityId
        description: Garmin unique activity identifier.
      - name: _ingested_at
        description: Timestamp when the record was ingested.

  - name: stg_garmin__activity_weather
    description: >
      Deduplicated view of weather conditions during activities. weather_data
      JSON object parsed into typed columns (temp, humidity, wind, station).
    columns:
      - name: activityId
        description: Garmin unique activity identifier.
      - name: weather_temp
        description: Temperature during the activity (Fahrenheit).
      - name: weather_apparent_temp
        description: Apparent/feels-like temperature.
      - name: weather_relative_humidity
        description: Relative humidity percentage.
      - name: weather_wind_speed
        description: Wind speed.
      - name: weather_wind_direction_compass
        description: Wind direction compass point (e.g., ene, nw).
      - name: weather_station_name
        description: Name of the weather station.
      - name: weather_type
        description: Weather type description (e.g., Fair, Cloudy).
      - name: _ingested_at
        description: Timestamp when the record was ingested.

  # ── GROUP 5: Large scalar tables ────────────────────────────────────────

  - name: stg_garmin__stats_and_body
    description: >
      Deduplicated view of the comprehensive daily wellness summary. Scalar fields
      cover steps, distance, calories, heart rate, stress, body battery, respiration,
      SpO2, body composition, and intensity minutes. JSON fields (bodyBatteryActivityEventList,
      bodyBatteryDynamicFeedbackEvent, endOfDayBodyBatteryDynamicFeedbackEvent) are
      parsed into typed ARRAYs and scalar fields.
    columns:
      - name: userProfileId
        description: Garmin user profile identifier.
      - name: date
        description: Date of the summary.
      - name: _ingested_at
        description: Timestamp when the record was ingested.
      - name: body_battery_activity_events
        description: >
          Parsed ARRAY<STRUCT> from bodyBatteryActivityEventList. Each element contains
          event_type, event_start_time_gmt, event_update_time_gmt, timezone_offset,
          duration_in_milliseconds, body_battery_impact, feedback_type, short_feedback, device_id.
      - name: dynamic_feedback_timestamp_gmt
        description: Timestamp of the intraday body battery dynamic feedback event.
      - name: dynamic_feedback_battery_level
        description: Body battery level label at the dynamic feedback event (e.g. HIGH, MODERATE).
      - name: dynamic_feedback_short_type
        description: Short feedback type key for the dynamic feedback event.
      - name: dynamic_feedback_long_type
        description: Long feedback type key for the dynamic feedback event.
      - name: eod_feedback_timestamp_gmt
        description: Timestamp of the end-of-day body battery dynamic feedback event.
      - name: eod_feedback_battery_level
        description: Body battery level label at end-of-day feedback event.
      - name: eod_feedback_short_type
        description: Short feedback type key for the end-of-day feedback event.
      - name: eod_feedback_long_type
        description: Long feedback type key for the end-of-day feedback event.

  - name: stg_garmin__user_summary
    description: >
      Deduplicated view of the daily user wellness summary (~152 scalar fields).
      JSON fields (bodyBatteryActivityEventList, bodyBatteryDynamicFeedbackEvent,
      endOfDayBodyBatteryDynamicFeedbackEvent, rule) are parsed into typed ARRAYs,
      scalar fields, and STRUCTs.
    columns:
      - name: userProfileId
        description: Garmin user profile identifier.
      - name: date
        description: Date of the summary.
      - name: body_battery_activity_events
        description: >
          Parsed ARRAY<STRUCT> from bodyBatteryActivityEventList. Each element contains
          event_type, event_start_time_gmt, event_update_time_gmt, timezone_offset,
          duration_in_milliseconds, body_battery_impact, feedback_type, short_feedback, device_id.
      - name: dynamic_feedback_timestamp_gmt
        description: Timestamp of the intraday body battery dynamic feedback event.
      - name: dynamic_feedback_battery_level
        description: Body battery level label at the dynamic feedback event (e.g. HIGH, MODERATE).
      - name: dynamic_feedback_short_type
        description: Short feedback type key for the dynamic feedback event.
      - name: dynamic_feedback_long_type
        description: Long feedback type key for the dynamic feedback event.
      - name: eod_feedback_timestamp_gmt
        description: Timestamp of the end-of-day body battery dynamic feedback event.
      - name: eod_feedback_battery_level
        description: Body battery level label at end-of-day feedback event.
      - name: eod_feedback_short_type
        description: Short feedback type key for the end-of-day feedback event.
      - name: eod_feedback_long_type
        description: Long feedback type key for the end-of-day feedback event.
      - name: rule
        description: >
          Parsed STRUCT from rule JSON. Contains type_id (INT64) and type_key (STRING),
          e.g. typeId=3, typeKey="subscribers".
      - name: _ingested_at
        description: Timestamp when the record was ingested.

  - name: stg_garmin__device_info
    description: >
      Deduplicated view of device metadata and capability flags (~386 fields).
    columns:
      - name: deviceId
        description: Garmin device identifier.
      - name: _ingested_at
        description: Timestamp when the record was ingested.
