version: 2

models:
  - name: svc_spotify_legacy__recently_played
    description: >
      Service table for legacy Spotify recently played tracks. Incrementally merges new data
      from the staging view, ensuring uniqueness on played_at + track_id.
    columns:
      - name: played_at
        description: Timestamp indicating when the track was played.
        tests:
          - not_null
      - name: track_id
        description: Spotify unique track identifier, extracted from the track record.
        tests:
          - not_null
      - name: track
        description: Nested record containing full track metadata.
      - name: context
        description: Nested record containing playback context.
      - name: _ingested_at
        description: Timestamp when the record was ingested into the normalized table.
        tests:
          - not_null
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - played_at
              - track_id

  - name: svc_spotify_legacy__saved_tracks
    description: >
      Service table for legacy Spotify saved tracks. Incrementally merges new data
      from the staging view, ensuring uniqueness on track_id.
    columns:
      - name: track_id
        description: Spotify unique track identifier, extracted from the track record.
        tests:
          - unique
          - not_null
      - name: track
        description: Nested record containing full track metadata.
      - name: added_at
        description: Timestamp when the track was saved to the user's library.
        tests:
          - not_null
      - name: _ingested_at
        description: Timestamp of the ingestion batch.
        tests:
          - not_null

  - name: svc_spotify_legacy__saved_albums
    description: >
      Service table for legacy Spotify saved albums. Incrementally merges new data
      from the staging view, ensuring uniqueness on album_id.
    columns:
      - name: album_id
        description: Spotify unique album identifier, extracted from the album record.
        tests:
          - unique
          - not_null
      - name: album
        description: Nested record containing full album metadata.
      - name: added_at
        description: Timestamp when the album was saved to the user's library.
        tests:
          - not_null
      - name: _ingested_at
        description: Timestamp of the ingestion batch.
        tests:
          - not_null

  - name: svc_spotify_legacy__top_artists
    description: >
      Service table for legacy Spotify top artists. Incrementally merges new data
      from the staging view, ensuring uniqueness on artist id.
    columns:
      - name: id
        description: Spotify unique artist identifier.
        tests:
          - unique
          - not_null
      - name: name
        description: Artist name.
      - name: popularity
        description: Artist popularity score (0-100).
      - name: genres
        description: Array of genre strings associated with the artist.
      - name: images
        description: Array of image records for the artist.
      - name: followers
        description: Record containing follower count and href.
      - name: external_urls
        description: Record containing the Spotify URL for the artist.
      - name: _ingested_at
        description: Timestamp of the ingestion batch.
        tests:
          - not_null

  - name: svc_spotify_legacy__top_tracks
    description: >
      Service table for legacy Spotify top tracks. Incrementally merges new data
      from the staging view, ensuring uniqueness on track id.
    columns:
      - name: id
        description: Spotify unique track identifier.
        tests:
          - unique
          - not_null
      - name: name
        description: Track name.
      - name: popularity
        description: Track popularity score (0-100).
      - name: duration_ms
        description: Track duration in milliseconds.
      - name: artists
        description: Array of artist records associated with the track.
      - name: album
        description: Record containing album metadata for the track.
      - name: external_urls
        description: Record containing the Spotify URL for the track.
      - name: _ingested_at
        description: Timestamp of the ingestion batch.
        tests:
          - not_null

  - name: svc_spotify_legacy__playlists
    description: >
      Service table for legacy Spotify playlists. Incrementally merges new data
      from the staging view, ensuring uniqueness on playlist id.
    columns:
      - name: id
        description: Spotify unique playlist identifier.
        tests:
          - unique
          - not_null
      - name: name
        description: Playlist name.
      - name: description
        description: Playlist description.
      - name: owner
        description: Record containing playlist owner information.
      - name: _ingested_at
        description: Timestamp of the ingestion batch.
        tests:
          - not_null

  - name: svc_spotify_legacy__album_detail
    description: >
      Service table for legacy Spotify album details. Incrementally merges new data
      from the staging view, ensuring uniqueness on album id.
    columns:
      - name: id
        description: Spotify unique album identifier.
        tests:
          - unique
          - not_null
      - name: name
        description: Album name.
      - name: artists
        description: Array of artist records associated with the album.
      - name: release_date
        description: Album release date.
      - name: label
        description: Record label that released the album.
      - name: _ingested_at
        description: Timestamp of the ingestion batch.
        tests:
          - not_null

  - name: svc_spotify_legacy__album_tracks
    description: >
      Service table for legacy Spotify album tracks. Incrementally merges new data
      from the staging view, ensuring uniqueness on album_id + track id.
    columns:
      - name: id
        description: Spotify unique track identifier.
        tests:
          - not_null
      - name: album_id
        description: Spotify unique album identifier for which this track belongs.
        tests:
          - not_null
      - name: name
        description: Track name.
      - name: duration_ms
        description: Track duration in milliseconds.
      - name: track_number
        description: Track position within the album.
      - name: artists
        description: Array of artist records associated with the track.
      - name: _ingested_at
        description: Timestamp of the ingestion batch.
        tests:
          - not_null
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - album_id
              - id

  - name: svc_spotify_legacy__artist_detail
    description: >
      Service table for legacy Spotify artist details. Incrementally merges new data
      from the staging view, ensuring uniqueness on artist id.
    columns:
      - name: id
        description: Spotify unique artist identifier.
        tests:
          - unique
          - not_null
      - name: name
        description: Artist name.
      - name: popularity
        description: Artist popularity score (0-100).
      - name: genres
        description: Array of genre strings associated with the artist.
      - name: followers
        description: Record containing follower count and href.
      - name: _ingested_at
        description: Timestamp of the ingestion batch.
        tests:
          - not_null
