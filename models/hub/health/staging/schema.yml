version: 2

models:
  - name: hub_health_stg__sleep_daily
    description: >
      One Garmin account-level night per wake-up date. Date D represents the night D-1 to D; no identity is invented
      when the source lacks a profile ID. Normalizes, qualifies and deterministically deduplicates lake records.
    columns:
      - name: health_date
        description: >
          Source local calendar date. Partition date for service tables; null dates are retained as invalid.
      - name: source_user_id
        description: >
          Original Garmin identifier as STRING, nullable for account-scoped sources; not a cross-source identity
          mapping.
      - name: identity_scope
        description: >
          Identity namespace: profile, user or account. Account means the source provides no user identifier.
      - name: source_system
        description: >
          Source system, always garmin.
      - name: source_table
        description: >
          Lake source contributing the canonical base record. Body measurements can also use fields from the other
          endpoint.
      - name: source_record_key
        description: >
          JSON representation of source key fields for traceability, not a global person identity.
      - name: sleep_calendar_date
        description: >
          Normalized sleep calendar date.
      - name: sleep_score
        description: >
          Normalized sleep score. Values outside the declared domain become NULL and remain visible in source_values and
          quality_issues.
      - name: score_qualifier
        description: >
          Normalized score qualifier.
      - name: quality_key
        description: >
          Normalized quality key.
      - name: score_feedback
        description: >
          Normalized score feedback.
      - name: total_sleep_s
        description: >
          Normalized total sleep s. Seconds. Values outside the declared domain become NULL and remain visible in
          source_values and quality_issues.
      - name: deep_sleep_s
        description: >
          Normalized deep sleep s. Seconds. Values outside the declared domain become NULL and remain visible in
          source_values and quality_issues.
      - name: light_sleep_s
        description: >
          Normalized light sleep s. Seconds. Values outside the declared domain become NULL and remain visible in
          source_values and quality_issues.
      - name: rem_sleep_s
        description: >
          Normalized rem sleep s. Seconds. Values outside the declared domain become NULL and remain visible in
          source_values and quality_issues.
      - name: awake_sleep_s
        description: >
          Normalized awake sleep s. Seconds. Values outside the declared domain become NULL and remain visible in
          source_values and quality_issues.
      - name: unmeasurable_sleep_s
        description: >
          Normalized unmeasurable sleep s. Seconds. Values outside the declared domain become NULL and remain visible in
          source_values and quality_issues.
      - name: nap_s
        description: >
          Normalized nap s. Seconds. Values outside the declared domain become NULL and remain visible in source_values
          and quality_issues.
      - name: avg_overnight_hrv_ms
        description: >
          Normalized avg overnight hrv ms. Milliseconds. Values outside the declared domain become NULL and remain
          visible in source_values and quality_issues.
      - name: hrv_status
        description: >
          Normalized hrv status.
      - name: resting_hr_bpm
        description: >
          Normalized resting hr bpm. Beats per minute. Values outside the declared domain become NULL and remain visible
          in source_values and quality_issues.
      - name: body_battery_change
        description: >
          Normalized body battery change.
      - name: avg_spo2_pct
        description: >
          Normalized avg spo2 pct. Percentage points, not a fraction. Values outside the declared domain become NULL and
          remain visible in source_values and quality_issues.
      - name: lowest_spo2_pct
        description: >
          Normalized lowest spo2 pct. Percentage points, not a fraction. Values outside the declared domain become NULL
          and remain visible in source_values and quality_issues.
      - name: avg_respiration_rpm
        description: >
          Normalized avg respiration rpm. Breaths per minute. Values outside the declared domain become NULL and remain
          visible in source_values and quality_issues.
      - name: lowest_respiration_rpm
        description: >
          Normalized lowest respiration rpm. Breaths per minute. Values outside the declared domain become NULL and
          remain visible in source_values and quality_issues.
      - name: highest_respiration_rpm
        description: >
          Normalized highest respiration rpm. Breaths per minute. Values outside the declared domain become NULL and
          remain visible in source_values and quality_issues.
      - name: restless_moments
        description: >
          Normalized restless moments. Values outside the declared domain become NULL and remain visible in
          source_values and quality_issues.
      - name: sleep_start_at_utc
        description: >
          Normalized sleep start at utc. TIMESTAMP representing a UTC instant.
      - name: sleep_end_at_utc
        description: >
          Normalized sleep end at utc. TIMESTAMP representing a UTC instant.
      - name: sleep_start_at_local
        description: >
          Normalized sleep start at local. DATETIME preserving the source wall clock; no timezone is inferred.
      - name: sleep_end_at_local
        description: >
          Normalized sleep end at local. DATETIME preserving the source wall clock; no timezone is inferred.
      - name: body_battery_at_sleep
        description: >
          Normalized body battery at sleep. Values outside the declared domain become NULL and remain visible in
          source_values and quality_issues.
      - name: body_battery_at_wake
        description: >
          Normalized body battery at wake. Values outside the declared domain become NULL and remain visible in
          source_values and quality_issues.
      - name: source_values
        description: >
          Typed normalized values before domain masking, plus original timestamp strings where relevant. Preserves
          invalid measurements for diagnosis.
      - name: quality_status
        description: >
          Row qualification: invalid for key, domain or coherence issues; partial for missing core metrics; valid
          otherwise. Optional missing fields are allowed.
      - name: quality_issues
        description: >
          Machine-readable reasons; empty only when no declared rule is triggered. This is data qualification, not a
          medical interpretation.
      - name: _ingested_at
        description: >
          Original source ingestion timestamp, or latest contributing ingestion for reconciled body measurements.

