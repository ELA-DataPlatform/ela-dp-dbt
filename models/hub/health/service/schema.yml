          Unmodified source timestamp represented as STRING for traceability.
      - name: timeseries.source_end_timestamp
        description: >
          Unmodified interval end represented as STRING when supplied.
      - name: timeseries.source_local_timestamp
        description: >
          Unmodified local timestamp represented as STRING when supplied.
      - name: timeseries.source_sample
        description: >
          Original source sample serialized to JSON, including confidence, algorithm status or epoch duration when
          supplied.
      - name: timeseries.quality_status
        description: >
          Point qualification independent of daily quality_status: valid, partial for a missing value, or invalid for
          key/time/domain issues.
      - name: timeseries.quality_issues
        description: >
          Point-level qualification reasons. Missing measurements remain explicit and are not interpolated.

