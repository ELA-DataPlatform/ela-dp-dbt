version: 2

models:
  - name: stg_hub__running_activities
    description: >
      One row per running activity (road, trail, treadmill), enriched with the sleep from
      the preceding night and the athletic context available on the day of the activity.
      Metrics are grouped into typed STRUCTs for readability.
    columns:
      - name: activity_id
        description: Garmin unique activity identifier.
        tests:
          - unique
          - not_null
      - name: activity_name
        description: User-defined or auto-generated activity name.
      - name: location_name
        description: Location name resolved by Garmin at the time of the activity.
      - name: start_time_local
        description: Activity start time in local timezone.
        tests:
          - not_null
      - name: start_time_gmt
        description: Activity start time in UTC.
      - name: activity_date
        description: Calendar date of the activity (derived from start_time_local).
        tests:
          - not_null
      - name: activity_type
        description: Garmin activity type key. One of running, trail_running, treadmill_running.
        tests:
          - not_null
          - accepted_values:
              values: ['running', 'trail_running', 'treadmill_running']
      - name: _ingested_at
        description: Timestamp when the source activity record was last loaded into the lake.
      - name: hr_zones
        description: >
          Array of heart rate zones for the activity. Each entry contains zone_number,
          secs_in_zone, and zone_low_boundary (bpm).
      - name: split_summaries
        description: >
          Array of split summaries (e.g. INTERVAL_ACTIVE, REST). Each entry contains
          aggregated pace, distance, elevation and power metrics per split type.
      - name: performance
        description: >
          STRUCT grouping all activity performance metrics: distance, duration, pace, speed,
          elevation, calories, heart rate, cadence, power, running dynamics, training effect,
          training load, VO2max measured during the activity, and PR flag.
      - name: gps
        description: >
          STRUCT with start/end GPS coordinates and elevation stats for the activity.
      - name: weather
        description: >
          STRUCT with weather conditions at the start of the activity: temperature,
          apparent temperature, dew point, humidity, wind speed/direction, and weather type.
      - name: sleep
        description: >
          STRUCT with sleep metrics from the night preceding the activity. The Garmin sleep
          record for date D covers the night D-1 → D, so sleep.date = activity_date.
          Includes overall score, phase durations, HRV, resting HR, SpO2, and respiration.
      - name: athletic_context
        description: >
          STRUCT grouping all contextual fitness indicators available on the day of the
          activity: training readiness score and its contributing factors (sleep, HRV,
          stress history, recovery time, ACWR), most recent VO2max, most recent body
          composition (weight, body fat, BMI, muscle mass), and the raw Garmin training
          status JSON (keyed by device ID, contains training load balance and status phrase).

  - name: stg_hub__running_activity_seconds
    description: >
      Per-measurement timeseries for running activities, sourced from the Garmin
      activityDetailMetrics payload stored in svc_garmin__activity_details.detailed_data.
      Each row represents one Garmin GPS/sensor sample (~2-second intervals).
      Only running, trail_running, and treadmill_running activities are included.
      Note: the service layer retains only the most recently ingested page of the
      Garmin API response per activity, so very long activities may have partial data.
    columns:
      - name: activity_id
        description: Garmin unique activity identifier. Foreign key to stg_hub__running_activities.
        tests:
          - not_null
      - name: activity_date
        description: Calendar date of the parent activity.
      - name: activity_type
        description: Garmin activity type key (running, trail_running, treadmill_running).
      - name: timestamp_gmt
        description: UTC timestamp of this measurement, derived from directTimestamp (Unix ms).
        tests:
          - not_null
      - name: elapsed_s
        description: Cumulative elapsed seconds since the start of the activity.
      - name: duration_s
        description: Cumulative active (timer-on) seconds since the start of the activity.
      - name: moving_duration_s
        description: Cumulative moving seconds since the start of the activity.
      - name: cum_distance_m
        description: Cumulative distance in meters since the start of the activity.
      - name: speed_m_per_s
        description: Instantaneous speed in meters per second.
      - name: heart_rate_bpm
        description: Instantaneous heart rate in beats per minute.
      - name: cadence_spm
        description: Running cadence in steps per minute (double cadence = both feet).
      - name: fractional_cadence
        description: Fractional cadence component (sub-step precision).
      - name: body_battery
        description: Garmin Body Battery level at this measurement point (0–100).
      - name: latitude
        description: GPS latitude in decimal degrees.
      - name: longitude
        description: GPS longitude in decimal degrees.
      - name: _ingested_at
        description: Timestamp when the source activity_details record was last loaded into the lake.
