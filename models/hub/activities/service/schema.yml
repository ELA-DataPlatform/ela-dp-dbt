version: 2

models:
  - name: svc_hub__running_activities
    description: >
      Incremental service table for running activities. One row per activity, partitioned
      by activity_date (monthly) and clustered by activity_type. Merges on activity_id.
      Contains the full enriched record from stg_hub__running_activities including
      performance metrics, GPS, weather, sleep context, and athletic context STRUCTs.
    columns:
      - name: activity_id
        description: Garmin unique activity identifier. Primary key.
        tests:
          - unique
          - not_null
      - name: activity_name
        description: User-defined or auto-generated activity name.
      - name: location_name
        description: Location name resolved by Garmin at the time of the activity.
      - name: start_time_local
        description: Activity start time in local timezone.
        tests:
          - not_null
      - name: start_time_gmt
        description: Activity start time in UTC.
      - name: activity_date
        description: Calendar date of the activity. Used as the partition field.
        tests:
          - not_null
      - name: activity_type
        description: Garmin activity type key. One of running, trail_running, treadmill_running.
        tests:
          - not_null
      - name: _ingested_at
        description: Timestamp when the source activity record was last loaded into the lake.
      - name: hr_zones
        description: Array of heart rate zones. Each entry has zone_number, secs_in_zone, zone_low_boundary.
      - name: split_summaries
        description: Array of split summaries per split type (e.g. INTERVAL_ACTIVE, REST).
      - name: performance
        description: STRUCT with all activity performance metrics (distance, pace, HR, power, training effect, etc.).
      - name: gps
        description: STRUCT with GPS coordinates and elevation stats.
      - name: weather
        description: STRUCT with weather conditions during the activity.
      - name: sleep
        description: STRUCT with sleep metrics from the preceding night.
      - name: athletic_context
        description: STRUCT with training readiness, VO2max, body composition, and training status on the activity day.

  - name: svc_hub__master_running_activities
    description: >
      Master incremental service table for running activities. One row per activity,
      partitioned by activity_date (monthly) and clustered by activity_type.
      This is the hub reference table for all running activity consumption (dashboards, APIs).
      Contains every field from every lake source, fully denormalized and structured.
      See stg_hub__master_running_activities for the full column documentation.
    columns:
      - name: activity_id
        description: Garmin unique activity identifier. Primary key.
        tests:
          - unique
          - not_null
      - name: activity_date
        description: Calendar date of the activity. Partition field (monthly).
        tests:
          - not_null
      - name: activity_type
        description: Garmin activity type key. Cluster field.
        tests:
          - not_null
      - name: start_time_local
        description: Activity start time in local timezone.
        tests:
          - not_null
      - name: _ingested_at
        description: Timestamp when the source activity record was last loaded into the lake.

  - name: svc_hub__running_activity_seconds
    description: >
      Incremental service table for per-measurement running timeseries. One row per
      Garmin sensor sample (~2-second intervals), partitioned by activity_date (monthly)
      and clustered by activity_id. Merges on (activity_id, timestamp_gmt).
    columns:
      - name: activity_id
        description: Garmin unique activity identifier. Part of the composite primary key.
        tests:
          - not_null
      - name: timestamp_gmt
        description: UTC timestamp of this measurement. Part of the composite primary key.
        tests:
          - not_null
      - name: activity_date
        description: Calendar date of the parent activity. Used as the partition field.
      - name: activity_type
        description: Garmin activity type key (running, trail_running, treadmill_running).
      - name: elapsed_s
        description: Cumulative elapsed seconds since activity start.
      - name: duration_s
        description: Cumulative active (timer-on) seconds since activity start.
      - name: moving_duration_s
        description: Cumulative moving seconds since activity start.
      - name: cum_distance_m
        description: Cumulative distance in meters since activity start.
      - name: speed_m_per_s
        description: Instantaneous speed in meters per second.
      - name: heart_rate_bpm
        description: Instantaneous heart rate in beats per minute.
      - name: cadence_spm
        description: Running cadence in steps per minute.
      - name: fractional_cadence
        description: Fractional cadence component (sub-step precision).
      - name: body_battery
        description: Garmin Body Battery level at this measurement point (0–100).
      - name: latitude
        description: GPS latitude in decimal degrees.
      - name: longitude
        description: GPS longitude in decimal degrees.
      - name: _ingested_at
        description: Timestamp when the source activity_details record was last loaded into the lake.
