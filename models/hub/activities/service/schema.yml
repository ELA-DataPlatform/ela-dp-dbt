version: 2

models:
  - name: hub_activities_svc__master_running_activities
    description: >
      Master incremental service table for running activities. One row per activity,
      partitioned by activity_date (monthly) and clustered by activity_type.
      This is the hub reference table for all running activity consumption (dashboards, APIs).
      Contains every field from every lake source, fully denormalized and structured.
      See hub_activities_stg__master_running_activities for the full column documentation.
    columns:
      - name: activity_id
        description: Garmin unique activity identifier. Primary key.
      - name: activity_date
        description: Calendar date of the activity. Partition field (monthly).
      - name: activity_type
        description: Garmin activity type key. Cluster field.
      - name: start_time_local
        description: Activity start time in local timezone.
      - name: _ingested_at
        description: Timestamp when the source activity record was last loaded into the lake.
