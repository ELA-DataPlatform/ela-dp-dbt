version: 2
models:
  - name: hub_activities_svc__master_running_activities
    description: Compatibility table for the historical three running types. Rebuilt from master_activities; public
      paths retained, source parsing and physical units corrected. New consumers should use master_activities.
    columns:
      - name: activity_id
        description: Garmin unique activity identifier. Primary key.
      - name: activity_date
        description: Calendar date of the activity. Partition field (monthly).
      - name: activity_type
        description: Garmin activity type key. Cluster field.
      - name: start_time_local
        description: Activity start time in local timezone.
      - name: _ingested_at
        description: Timestamp when the source activity record was last loaded into the lake.
  - name: hub_activities_svc__fact_activity
    description: One canonical Garmin activity, all sports and all available history. Single platform account; source
      owner ID is preserved. Services are fully rebuilt so late and historical corrections are propagated.
    columns:
      - name: activity_id
        description: Garmin activity ID. Unique within the current single-account platform.
        data_tests:
          - not_null
          - unique
      - name: activity_date
        description: Local activity calendar date; monthly partition. NULL remains visible if source local time
          is absent.
      - name: activity_key
        description: 'Stable source-qualified key: garmin:ownerId:activityId. Missing owner is explicitly account-scoped.'
        data_tests:
          - not_null
          - unique
      - name: identity
        description: STRUCT of activity UUID, name, description, location, device, manufacturer and source user
          identity.
      - name: sport
        description: STRUCT of classified family, original Garmin type and parent IDs. Unknown types remain visible
          as other; no guessed mapping.
      - name: timing
        description: STRUCT of UTC instants, local DATETIME and original numeric timezone ID. No IANA timezone is
          inferred.
      - name: performance
        description: 'STRUCT of qualified common metrics: metres, seconds, m/s, bpm, watts, rpm, Celsius and source
          training effects.'
      - name: running
        description: 'Nullable STRUCT for running family: pace in min/km, cadence in steps/min, stride in metres,
          contact in ms, oscillation in mm, ratio in percent and fastest splits in seconds.'
      - name: cycling
        description: Nullable STRUCT for cycling family, currently average and normalized power in watts. No cadence
          is invented from running cadence.
      - name: strength
        description: 'Nullable STRUCT for strength family: total repetitions, total sets and active sets.'
      - name: gps
        description: STRUCT of qualified start/end latitude [-90,90] and longitude [-180,180], in decimal degrees.
      - name: flags
        description: STRUCT of source flags, including multisport-parent status. Parent and child activities are
          not deduplicated into an invented workout.
      - name: event_type
        description: Original typed Garmin event classification.
      - name: source_values
        description: Typed original activity row, before qualification. Includes source fields not promoted into
          the public domain blocks.
      - name: quality_status
        description: 'Base row qualification: valid, partial or invalid. For master, refers to the activity summary
          only.'
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - valid
                  - partial
                  - invalid
      - name: quality_issues
        description: Ordered ARRAY<STRING> of structural anomaly/missing-data codes; an empty array means no issues
          at this grain.
      - name: _ingested_at
        description: Source ingestion timestamp, never a domain observation time. Master retains summary ingestion;
          see provenance for detail timestamps.
      - name: _silver_processed_at
        description: UTC rebuild time, not a business-change watermark.
      - name: source_system
        description: 'Source system: garmin.'
      - name: source_table
        description: Source family or explicitly identified contributing families.
      - name: source_record_key
        description: Original source activity identifier, represented as STRING.
  - name: hub_activities_svc__activity_recording
    description: One source activity-details response per activity. Curves contain the returned source samples;
      no one-second completeness guarantee. Services are fully rebuilt so late and historical corrections are propagated.
    columns:
      - name: activity_id
        description: Garmin activity ID. Unique within the current single-account platform.
        data_tests:
          - not_null
          - unique
      - name: timeseries
        description: 'Ordered ARRAY<STRUCT> of samples: UTC timestamp, source offset/key, distance in metres, time
          in seconds, speed in m/s, FC in bpm, power in W, stride in m, oscillation in mm, quality and source slots.
          Invalid timestamps remain last; duplicate instants retain separate source offsets. No interpolation.'
      - name: route
        description: Nullable typed source-compatible geometry STRUCT. Coordinates are qualified; the complete original
          route remains in source_values.route.
      - name: metric_descriptors
        description: Ordered source metric definitions, including unit_key and unit_factor. API values already use
          unit_key; factor is retained and not blindly applied.
      - name: source_details_available
        description: Source response flag; distinct from actual presence of samples.
      - name: source_total_metrics_count
        description: Original totalMetricsCount; no interpretation as exact recording frequency.
      - name: source_metrics_count
        description: Original metricsCount.
      - name: source_measurement_count
        description: Original measurementCount.
      - name: invalid_sample_count
        description: Number of returned samples with invalid timestamp, descriptor, numeric value or unit.
      - name: partial_sample_count
        description: Number of samples with no non-timestamp measurement.
      - name: source_values
        description: STRUCT containing original route, pending response data and residual heart-rate DTOs.
      - name: quality_status
        description: 'Base row qualification: valid, partial or invalid. For master, refers to the activity summary
          only.'
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - valid
                  - partial
                  - invalid
      - name: quality_issues
        description: Ordered ARRAY<STRING> of structural anomaly/missing-data codes; an empty array means no issues
          at this grain.
      - name: _ingested_at
        description: Source ingestion timestamp, never a domain observation time. Master retains summary ingestion;
          see provenance for detail timestamps.
      - name: _silver_processed_at
        description: UTC rebuild time, not a business-change watermark.
      - name: source_system
        description: 'Source system: garmin.'
      - name: source_table
        description: Source family or explicitly identified contributing families.
      - name: source_record_key
        description: Original source activity identifier, represented as STRING.
      - name: invalid_route_point_count
        description: Number of invalid geometry elements across source start, end and polyline points. A coordinate
          is masked without discarding its source point.
  - name: hub_activities_svc__activity_splits
    description: One activity-splits response per activity. Independent repeated families are assembled without
      Cartesian products. Services are fully rebuilt so late and historical corrections are propagated.
    columns:
      - name: activity_id
        description: Garmin activity ID. Unique within the current single-account platform.
        data_tests:
          - not_null
          - unique
      - name: laps
        description: Ordered ARRAY<STRUCT> of laps, identified by item_key and source_index. Units appear in field
          names; original lap_index/message_index and complete typed source_values are retained. Stride is in metres;
          oscillation in millimetres.
      - name: typed_splits
        description: Ordered ARRAY<STRUCT> of typed movement intervals. Independent source offsets, UTC timestamps,
          local DATETIME, units, original values and per-item quality.
      - name: split_summaries
        description: Ordered ARRAY<STRUCT> of summary categories. Independent source offsets and per-item quality.
          Not additive with laps or typed splits.
      - name: quality_status
        description: 'Base row qualification: valid, partial or invalid. For master, refers to the activity summary
          only.'
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - valid
                  - partial
                  - invalid
      - name: quality_issues
        description: Ordered ARRAY<STRING> of structural anomaly/missing-data codes; an empty array means no issues
          at this grain.
      - name: _ingested_at
        description: Source ingestion timestamp, never a domain observation time. Master retains summary ingestion;
          see provenance for detail timestamps.
      - name: _silver_processed_at
        description: UTC rebuild time, not a business-change watermark.
      - name: source_system
        description: 'Source system: garmin.'
      - name: source_table
        description: Source family or explicitly identified contributing families.
      - name: source_record_key
        description: Original source activity identifier, represented as STRING.
  - name: hub_activities_svc__activity_zones
    description: One activity with source summary or heart-rate-zone response. Zones from different source families
      are not added together. Services are fully rebuilt so late and historical corrections are propagated.
    columns:
      - name: activity_id
        description: Garmin activity ID. Unique within the current single-account platform.
        data_tests:
          - not_null
          - unique
      - name: heart_rate
        description: 'ARRAY<STRUCT> sorted by zone_number/source_index: duration_s, low_boundary_bpm, typed source
          values and quality. Source offsets retain identity even when zone numbers conflict.'
      - name: power
        description: ARRAY<STRUCT> of source zone numbers and durations in seconds. Missing source durations do
          not become zero-filled zones.
      - name: heart_rate_response_present
        description: Whether an endpoint response exists, even when its zone array is empty.
      - name: heart_rate_ingested_at
        description: Ingestion timestamp of the actual HR-zone response, excluding the summary fallback.
      - name: summary_ingested_at
        description: Ingestion timestamp of the activity summary supplying power zones.
      - name: quality_status
        description: 'Base row qualification: valid, partial or invalid. For master, refers to the activity summary
          only.'
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - valid
                  - partial
                  - invalid
      - name: quality_issues
        description: Ordered ARRAY<STRING> of structural anomaly/missing-data codes; an empty array means no issues
          at this grain.
      - name: _ingested_at
        description: Source ingestion timestamp, never a domain observation time. Master retains summary ingestion;
          see provenance for detail timestamps.
      - name: _silver_processed_at
        description: UTC rebuild time, not a business-change watermark.
      - name: source_system
        description: 'Source system: garmin.'
      - name: source_table
        description: Source family or explicitly identified contributing families.
      - name: source_record_key
        description: Original source activity identifier, represented as STRING.
  - name: hub_activities_svc__activity_exercise_sets
    description: One exercise-set response per activity; an empty response remains distinguishable from an absent
      response. Services are fully rebuilt so late and historical corrections are propagated.
    columns:
      - name: activity_id
        description: Garmin activity ID. Unique within the current single-account platform.
        data_tests:
          - not_null
          - unique
      - name: exercise_sets
        description: 'Ordered ARRAY<STRUCT>: stable set_key/source set_index, source message_index/type, UTC start,
          seconds, repetitions, weight_kg, candidate exercise ARRAY with probability [0,1], original values and
          item quality. Source grams are divided by 1000; bodyweight/absent load stays NULL.'
      - name: quality_status
        description: 'Base row qualification: valid, partial or invalid. For master, refers to the activity summary
          only.'
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - valid
                  - partial
                  - invalid
      - name: quality_issues
        description: Ordered ARRAY<STRING> of structural anomaly/missing-data codes; an empty array means no issues
          at this grain.
      - name: _ingested_at
        description: Source ingestion timestamp, never a domain observation time. Master retains summary ingestion;
          see provenance for detail timestamps.
      - name: _silver_processed_at
        description: UTC rebuild time, not a business-change watermark.
      - name: source_system
        description: 'Source system: garmin.'
      - name: source_table
        description: Source family or explicitly identified contributing families.
      - name: source_record_key
        description: Original source activity identifier, represented as STRING.
  - name: hub_activities_svc__activity_weather
    description: One canonical weather response per activity, from the source weather station rather than the device
      temperature curve. Services are fully rebuilt so late and historical corrections are propagated.
    columns:
      - name: activity_id
        description: Garmin activity ID. Unique within the current single-account platform.
        data_tests:
          - not_null
          - unique
      - name: observed_at_utc
        description: Parsed source issueDate, UTC. Not replaced by activity start or ingestion time.
      - name: temp_celsius
        description: Qualified source station temperature converted to Celsius according to the declared source
          contract.
      - name: apparent_temp_celsius
        description: Apparent station temperature, Celsius.
      - name: dew_point_celsius
        description: Station dew point, Celsius.
      - name: wind_speed_kph
        description: Wind speed in km/h only when garmin_activity_weather_wind_unit explicitly identifies the source
          unit. NULL by default; source value retained.
      - name: humidity_pct
        description: Relative humidity [0,100], percent.
      - name: wind_direction_deg
        description: Wind direction [0,360], degrees.
      - name: latitude
        description: Weather-station latitude, decimal degrees.
      - name: longitude
        description: Weather-station longitude, decimal degrees.
      - name: wind_direction_compass
        description: Source compass label.
      - name: weather_type
        description: Source condition description.
      - name: station_id
        description: Source weather-station identifier.
      - name: station_name
        description: Source station name.
      - name: source_temperature_unit
        description: 'Declared source contract: fahrenheit by default to match the existing lake; configurable celsius/unknown.'
      - name: source_wind_unit
        description: 'Declared source unit: unknown by default, or km_h/mph/m_s. No heuristic from numeric magnitude.'
      - name: source_values
        description: Complete typed weather service response before conversion and qualification.
      - name: quality_status
        description: 'Base row qualification: valid, partial or invalid. For master, refers to the activity summary
          only.'
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - valid
                  - partial
                  - invalid
      - name: quality_issues
        description: Ordered ARRAY<STRING> of structural anomaly/missing-data codes; an empty array means no issues
          at this grain.
      - name: _ingested_at
        description: Source ingestion timestamp, never a domain observation time. Master retains summary ingestion;
          see provenance for detail timestamps.
      - name: _silver_processed_at
        description: UTC rebuild time, not a business-change watermark.
      - name: source_system
        description: 'Source system: garmin.'
      - name: source_table
        description: Source family or explicitly identified contributing families.
      - name: source_record_key
        description: Original source activity identifier, represented as STRING.
  - name: hub_activities_svc__master_activities
    description: One row per fact activity, all sports. Complete typed assembly for products; optional detail never
      removes an activity. Summary quality is distinct from component/sample quality. Services are fully rebuilt
      so late and historical corrections are propagated.
    columns:
      - name: activity_id
        description: Garmin activity ID. Unique within the current single-account platform.
        data_tests:
          - not_null
          - unique
      - name: activity_date
        description: Local activity calendar date; monthly partition. NULL remains visible if source local time
          is absent.
      - name: activity_key
        description: Source-qualified stable key inherited from fact_activity.
        data_tests:
          - not_null
          - unique
      - name: identity
        description: Qualified identity STRUCT from fact_activity.
      - name: sport
        description: Original source type and classified sport family.
      - name: timing
        description: UTC instants and honest local DATETIME.
      - name: performance
        description: Common qualified metrics and explicit units.
      - name: running
        description: Running-family extension, NULL for other sports. Includes track_running.
      - name: cycling
        description: Cycling-family extension, NULL for other sports.
      - name: strength
        description: Strength-family summary extension, NULL for other sports.
      - name: gps
        description: Qualified summary start/end coordinates.
      - name: flags
        description: Source activity and multisport-parent flags.
      - name: event_type
        description: Typed source event classification.
      - name: recordings
        description: STRUCT of ordered timeseries ARRAY, route, source metric descriptors, availability/count metadata
          and recording source values.
      - name: breakdown
        description: STRUCT of independent laps, typed_splits and split_summaries ARRAYs; no cross multiplication.
      - name: zones
        description: STRUCT of heart_rate and power ARRAYs; missing repeated families are empty arrays.
      - name: exercise_sets
        description: Qualified ordered exercise-set ARRAY, including nested candidate exercise ARRAYs.
      - name: weather
        description: Nullable qualified station weather STRUCT with source units, original values and component
          quality.
      - name: health_context
        description: STRUCT of descriptive daily sleep, athletic_context and association metadata. Current single
          platform account only; identity matching and knowledge before start are NOT guaranteed. Weight/VO2max
          associations may use earlier dates.
      - name: quality
        description: STRUCT of status/issues for each component. Optional missing detail does not invalidate the
          base activity; missing component status is NULL.
      - name: availability
        description: STRUCT distinguishing source response presence, populated arrays and invalid/partial sample
          counts. Does not claim whether an absent response is unsupported or not yet fetched.
      - name: provenance
        description: Ordered ARRAY<STRUCT<source_table, source_ingested_at>> for activity source components. Processing
          time is not source observation time.
      - name: source_values
        description: Complete typed original activity summary, preserving all source fields not promoted into public
          blocks.
      - name: quality_status
        description: 'Base row qualification: valid, partial or invalid. For master, refers to the activity summary
          only.'
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - valid
                  - partial
                  - invalid
      - name: quality_issues
        description: Ordered ARRAY<STRING> of structural anomaly/missing-data codes; an empty array means no issues
          at this grain.
      - name: _ingested_at
        description: Source ingestion timestamp, never a domain observation time. Master retains summary ingestion;
          see provenance for detail timestamps.
      - name: _silver_processed_at
        description: UTC rebuild time, not a business-change watermark.

  - name: hub_activities_svc__music_timeline
    description: >
      Fully rebuilt each run to propagate historical corrections, dependency changes and removed derived rows.
      One row per Spotify track played during a running activity.
      The starting kilometre is estimated from the nearest timeseries point
      preceding the played_at timestamp. Shared by timeline and summary products.
    columns:
      - name: activity_id
        description: Garmin activity identifier.
        tests:
          - not_null
      - name: activity_date
        description: Calendar date of the activity.
        tests:
          - not_null
      - name: played_at
        description: Timestamp (GMT) when the track started playing on Spotify.
        tests:
          - not_null
      - name: track_id
        description: Spotify track identifier.
      - name: track_name
        description: Name of the track.
      - name: artist_id
        description: Spotify artist selected by ascending artist_id, preserving the existing timeline contract.
      - name: artist_name
        description: Name of the selected artist.
      - name: album_id
        description: Spotify album identifier.
      - name: album_name
        description: Name of the album.
      - name: album_image_url
        description: >
          URL of the album cover image (640x640) from the Spotify CDN.
          Extracted from dlk_spotify_svc__album_detail. NULL if not available.
      - name: duration_seconds
        description: Track duration in seconds.
      - name: km_start
        description: >
          Estimated kilometre at which the track started, derived from the timeseries
          point whose GMT timestamp is closest to (and before) played_at.
          NULL if the timeseries is unavailable for this activity.
      - name: latitude
        description: >
          GPS latitude at the moment the track started playing, interpolated from
          the nearest preceding timeseries point. NULL for treadmill activities.
      - name: longitude
        description: >
          GPS longitude at the moment the track started playing, interpolated from
          the nearest preceding timeseries point. NULL for treadmill activities.
      - name: _ingested_at
        description: Activity ingestion timestamp; does not track later music or recording corrections.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [activity_id, played_at, track_id]
