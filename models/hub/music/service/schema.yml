version: 2

models:
  - name: hub_music_svc__fact_played
    description: >
      One row per (played_at, track_id), consolidated from modern and legacy Spotify plays. Latest ingestion wins, followed by
      modern source and a deterministic payload tie-break. The service merges the entire deduplicated source on every run,
      including equal-timestamp and historical corrections.
    columns:
      - name: played_at
        description: Timestamp when the track was played.
        tests:
          - not_null
      - name: track_id
        description: Spotify unique track identifier.
        tests:
          - not_null
          - relationships:
              to: ref('hub_music_svc__ref_track')
              field: track_id
      - name: album_id
        description: Spotify unique album identifier.
      - name: context_type
        description: Type of playback context (e.g., playlist, album, artist).
      - name: context_uri
        description: Spotify URI of the playback context.
      - name: _ingested_at
        description: Timestamp of the ingestion batch from the source normalized table.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: ['played_at', 'track_id']

  - name: hub_music_svc__ref_track
    description: >
      Current track reference, one row per non-empty track_id. Consolidates modern and legacy top tracks, album tracks, plays and
      saved tracks. Selects a named source record deterministically; nullable duration, popularity and ISRC use the best available
      observation. Rebuilt completely on every service run.
    columns:
      - name: track_id
        description: Spotify unique track identifier.
        tests:
          - unique
          - not_null
      - name: track_name
        description: Display name of the track.
      - name: track_uri
        description: Spotify URI of the track.
      - name: duration_ms
        description: Duration of the track in milliseconds.
      - name: explicit
        description: Whether the track contains explicit content.
      - name: track_number
        description: Track number within the album.
      - name: disc_number
        description: Disc number within the album.
      - name: popularity
        description: Spotify popularity score (0–100).
      - name: isrc
        description: International Standard Recording Code.
      - name: album_id
        description: Spotify unique album identifier this track belongs to.
        tests:
          - relationships:
              to: ref('hub_music_svc__ref_album')
              field: album_id
      - name: is_local
        description: Whether the track is a local file.
      - name: metadata_source
        description: Source observation chosen for the canonical base record; nullable enrichment may use another observation.
      - name: _ingested_at
        description: Latest ingestion timestamp across all contributing track observations, independent of source priority.

  - name: hub_music_svc__ref_album
    description: >
      Current album reference, one row per non-empty album_id. Covers album details, saved albums and every album ID observed in
      tracks, including minimal references without metadata. Prefers usable detail records; nullable enrichment uses the best
      available observation. Rebuilt completely on every service run.
    columns:
      - name: album_id
        description: Spotify unique album identifier.
        tests:
          - unique
          - not_null
      - name: album_name
        description: Display name of the album.
      - name: album_type
        description: Type of the album (album, single, compilation).
      - name: total_tracks
        description: Total number of tracks in the album.
      - name: release_date
        description: Release date of the album.
      - name: release_date_precision
        description: Precision of the release date (year, month, or day).
      - name: album_uri
        description: Spotify URI of the album.
      - name: genres
        description: Repeated list of genres associated with the album. Populated from album_detail only.
      - name: label
        description: Record label that released the album. Populated from album_detail only.
      - name: popularity
        description: Album popularity score (0–100). Populated from album_detail only.
      - name: album_image_url
        description: URL of the preferred album cover image from Spotify, when available.
      - name: metadata_source
        description: Source observation chosen for the canonical base record; nullable enrichment may use another observation.
      - name: enrichment_status
        description: >
          Detail availability, independent of nullable optional fields. Complete means at least one detail
          observation has a usable name; unavailable means detail observations exist but none has a usable
          name; pending means no detail observation exists. A fallback name may still be available.
      - name: _ingested_at
        description: Latest ingestion timestamp across all contributing album observations, independent of source priority.

  - name: hub_music_svc__ref_artist
    description: >
      Current artist reference, one row per non-empty artist_id observed in details, top artists, track artist lists or album
      artist lists. Includes artists of unplayed catalogue tracks. Prefers usable rich records and preserves nullable enrichment
      from other observations. Rebuilt completely on every service run.
    columns:
      - name: artist_id
        description: Spotify unique artist identifier.
        tests:
          - unique
          - not_null
      - name: artist_name
        description: Display name of the artist.
      - name: artist_uri
        description: Spotify URI of the artist.
      - name: genres
        description: Repeated list of genres associated with the artist. Populated from artist_detail and top_artists only.
      - name: followers_total
        description: Total number of Spotify followers. Populated from artist_detail and top_artists only.
      - name: popularity
        description: Artist popularity score (0–100). Populated from artist_detail and top_artists only.
      - name: artist_image_url
        description: URL of the preferred artist profile image from Spotify, when available.
      - name: metadata_source
        description: Source observation chosen for the canonical base record; nullable enrichment may use another observation.
      - name: enrichment_status
        description: >
          Detail availability, independent of nullable optional fields. Complete means at least one detail
          observation has a usable name; unavailable means detail observations exist but none has a usable
          name; pending means no detail observation exists. A fallback name may still be available.
      - name: _ingested_at
        description: Latest ingestion timestamp across all contributing artist observations, independent of source priority.

  - name: hub_music_svc__ref_playlist
    description: >
      Reconciles all canonical staging rows without a global ingestion watermark; late and equal-timestamp corrections are included.
      Incremental service table for playlist reference data. One row per playlist_id.
      Updated with latest metadata on each run.
    columns:
      - name: playlist_id
        description: Spotify unique playlist identifier.
      - name: playlist_name
        description: Display name of the playlist.
      - name: description
        description: Playlist description.
      - name: collaborative
        description: Whether the playlist is collaborative.
      - name: public
        description: Whether the playlist is public.
      - name: snapshot_id
        description: Version identifier for the playlist snapshot.
      - name: owner_id
        description: Spotify user ID of the playlist owner.
      - name: total_tracks
        description: Total number of tracks in the playlist.
      - name: playlist_uri
        description: Spotify URI of the playlist.
      - name: _ingested_at
        description: Timestamp of the most recent ingestion batch for this playlist.

  - name: hub_music_svc__bridge_track_artist
    description: >
      Current track-to-artist associations, one row per (track_id, artist_id). Selects one complete non-empty artist list per
      track before expansion; priority is top tracks, album tracks, plays, saved tracks, then latest ingestion, source name and
      payload. Repeated artist IDs are collapsed and positions reindexed from zero. Full service rebuild removes obsolete
      associations.
    columns:
      - name: track_id
        description: Spotify unique track identifier.
        tests:
          - not_null
          - relationships:
              to: ref('hub_music_svc__ref_track')
              field: track_id
      - name: artist_id
        description: Spotify unique artist identifier.
        tests:
          - not_null
          - relationships:
              to: ref('hub_music_svc__ref_artist')
              field: artist_id
      - name: artist_position
        description: 0-based position of the artist in the track's artist list.
      - name: _ingested_at
        description: Ingestion timestamp of the canonical artist list selected for the entity.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: ['track_id', 'artist_id']

  - name: hub_music_svc__bridge_album_artist
    description: >
      Current album-to-artist associations, one row per (album_id, artist_id). Selects one complete non-empty artist list per
      album before expansion; priority is details, saved albums, track observations, then latest ingestion, source name and
      payload. Repeated artist IDs are collapsed and positions reindexed from zero. Full service rebuild removes obsolete
      associations.
    columns:
      - name: album_id
        description: Spotify unique album identifier.
        tests:
          - not_null
          - relationships:
              to: ref('hub_music_svc__ref_album')
              field: album_id
      - name: artist_id
        description: Spotify unique artist identifier.
        tests:
          - not_null
          - relationships:
              to: ref('hub_music_svc__ref_artist')
              field: artist_id
      - name: artist_position
        description: 0-based position of the artist in the album's artist list.
      - name: _ingested_at
        description: Ingestion timestamp of the canonical artist list selected for the entity.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: ['album_id', 'artist_id']
