  - name: pct_data4mcp__listening_history
    description: >-
      One row per canonical Spotify listening event (played_at, track_id), enriched from hub metadata. All available history.
      Artist aggregation prevents collaboration fanout; missing metadata never removes an event. Full rebuild propagates catalogue
      corrections.
    columns:
      - name: listening_id
        description: Stable SHA256 key of played_at and track_id, the canonical hub listening-event grain.
        data_tests:
          - not_null
          - unique
      - name: played_at
        description: Listening start instant, UTC TIMESTAMP.
        data_tests:
          - not_null
      - name: played_date
        description: Listening calendar date in Europe/Paris, derived from played_at.
      - name: played_at_local
        description: Listening wall-clock DATETIME in Europe/Paris, including DST rules.
      - name: track_id
        description: Spotify track identifier.
        data_tests:
          - not_null
      - name: track_name
        description: Current canonical track name; NULL if metadata is unavailable.
      - name: track_uri
        description: Spotify track URI; nullable.
      - name: track_duration_ms
        description: >-
          Catalogue track duration in milliseconds; not actual playback time. A play event does not prove a full listen.
      - name: explicit
        description: Spotify explicit-content flag; nullable.
      - name: album_id
        description: Album on the event, falling back to current track album only if absent.
      - name: album_name
        description: Current canonical album name; NULL if metadata is unavailable.
      - name: primary_artist_id
        description: Artist at bridge position zero; nullable. Use for rankings that attribute each play to one artist.
      - name: primary_artist_name
        description: Current canonical primary artist name; nullable.
      - name: artists
        description: >-
          Ordered ARRAY<STRUCT<artist_id, artist_name, artist_position>>. Empty if relationships are unavailable. UNNEST multiplies
          plays.
      - name: context_type
        description: Spotify context type as supplied by the listening event; nullable.
      - name: context_uri
        description: Spotify listening context URI; nullable.
      - name: quality_status
        description: >-
          Presence of track/album names and artist relationships/names: valid or partial. Optional catalogue fields can remain
          NULL. Partial events are retained and count as one play.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - valid
                  - partial
      - name: quality_issues
        description: Missing track, album or artist metadata codes; empty when complete.
      - name: _ingested_at
        description: UTC ingestion time of the listening event, independent of metadata enrichment.
      - name: _metadata_ingested_at
        description: Latest UTC ingestion timestamp of contributing track, album, bridge or artist metadata; nullable.
      - name: source_system
        description: 'Source system: spotify.'
      - name: timezone
        description: 'Calendar convention: Europe/Paris.'
      - name: _product_built_at
        description: UTC timestamp of this product table rebuild; not the collection time or latest listening event.
    config:
      meta:
        consumer: mcp
        grain: played_at, track_id
        timezone: Europe/Paris
