  - name: pct_data4mcp__activity_intervals
    description: >-
      One row per source lap, keyed by interval_id; nullable lap_index is not a key. All hub history; optional metrics remain
      NULL. No recording curves or GPS routes.
    columns:
      - name: interval_id
        description: >-
          Stable hub lap item key, based on activity ID and source array index; independent of nullable lap_index.
        data_tests:
          - not_null
          - unique
      - name: source_index
        description: Zero-based source array offset. Preserves ordering and sparse source positions.
      - name: activity_id
