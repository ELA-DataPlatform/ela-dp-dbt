  - name: pct_data4mcp__activities
    description: >-
      One row per Garmin activity, all sports. All hub history; optional metrics remain NULL. No recording curves or GPS routes.
    columns:
      - name: activity_id
        description: Garmin activity identifier; one row per activity in activities.
        data_tests:
          - not_null
          - unique
      - name: activity_name
        description: Original Garmin activity name.
      - name: activity_type
        description: Original Garmin sport type key; use to filter disciplines before aggregating.
      - name: activity_date
