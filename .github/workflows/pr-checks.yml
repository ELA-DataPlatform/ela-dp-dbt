name: dbt PR Checks

on:
  pull_request:
    branches: [develop, main]
    paths:
      - 'models/**'
      - 'macros/**'
      - 'snapshots/**'
      - 'seeds/**'
      - 'tests/**'
      - 'dbt_project.yml'
      - 'packages.yml'
      - '.sqlfluff'
      - '.yamllint.yml'
      - '.pre-commit-config.yaml'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'Makefile'
      - 'scripts/**'
      - 'README.md'
      - '.github/workflows/pr-checks.yml'

jobs:
  sqlfluff-lint:
    name: SQLFluff Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: uv sync --locked

      - name: Run SQLFluff
        run: make lint-sql

  dbt-parse:
    name: dbt Parse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: uv sync --locked

      - name: Install dbt packages
        run: uv run --locked dbt deps --profiles-dir .

      - name: Parse dbt project
        run: make parse-local
        env:
          DBT_TARGET: dev

  yaml-lint:
    name: YAML Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install yamllint
        run: uv sync --locked

      - name: Run yamllint
        run: make lint-yaml
