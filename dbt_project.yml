name: 'ela_dp'
version: '1.0.0'
profile: 'ela_dp'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

# Taille des lots pour l'enrichissement incrémental des détails Spotify.
# Consommées par stg_hub__albums_pending_detail / stg_hub__artists_pending_detail,
# elles-mêmes lues par les jobs d'ingestion album-detail / artist-detail.
vars:
  album_detail_batch_size: 50
  artist_detail_batch_size: 50

models:
  ela_dp:
    lake:
      spotify:
        +schema: "dp_lake_spotify_{{ target.name }}"
        +tags: ["spotify"]
        staging:
          +schema: "lake_spotify_stg_{{ target.name }}"
        service:
          +schema: "lake_spotify_svc_{{ target.name }}"
      spotify_legacy:
        +schema: "dp_lake_spotify_{{ target.name }}"
        +tags: ["spotify"]
        staging:
          +schema: "lake_spotify_legacy_stg_{{ target.name }}"
        service:
          +schema: "lake_spotify_legacy_svc_{{ target.name }}"
      garmin:
        +schema: "dp_lake_garmin_{{ target.name }}"
        +tags: ["garmin"]
        staging:
          +schema: "lake_garmin_stg_{{ target.name }}"
          +materialized: view
        service:
          +schema: "lake_garmin_svc_{{ target.name }}"
          +materialized: table
    hub:
      utils:
        +schema: "hub_utils_stg_{{ target.name }}"
        +materialized: view
      music:
        staging:
          +schema: "hub_music_stg_{{ target.name }}"
          +materialized: view
        service:
          +schema: "hub_music_svc_{{ target.name }}"
          +materialized: incremental
      activities:
        staging:
          +schema: "hub_activities_stg_{{ target.name }}"
          +materialized: view
        service:
          +schema: "hub_activities_svc_{{ target.name }}"
          +materialized: incremental
    product:
      webapp:
        +schema: "product_webapp_{{ target.name }}"
        +tags: ["webapp"]
        activity_focus:
          +materialized: table
      data4agent:
        +schema: "product_data4agent_{{ target.name }}"
        +materialized: table
        +tags: ["garmin", "data4agent"]
