version: 2

seeds:
  - name: seed_album_studio_overrides
    description: >
      Manual overrides for the "studio album" classification. Spotify's
      album_type does not distinguish live recordings or reissues from regular
      studio albums, so this seed lets us correct individual albums by hand
      (e.g. a live record like "Alive 2007" should be flagged is_studio = false).
      When an album_id is present here, its is_studio value wins; otherwise the
      default rule applies (is_studio_album = album_type = 'album'). The seed may
      be empty: in that case every album falls back to the default rule.
    columns:
      - name: album_id
        description: Spotify unique album identifier to override.
        tests:
          - unique
          - not_null
      - name: is_studio
        description: >
          TRUE to force the album to count as a studio album, FALSE to exclude it
          (live, reissue, etc.).
        tests:
          - not_null
