repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: ['--allow-multiple-documents']
      - id: check-added-large-files
        args: ['--maxkb=500']

  - repo: local
    hooks:
      - id: sqlfluff-lint
        name: SQLFluff lint (uv.lock)
        entry: scripts/sqlfluff.sh lint
        language: system
        files: '^(models|macros|snapshots)/.*\.sql$'
      - id: yamllint
        name: YAML lint (uv.lock)
        entry: uv run --locked yamllint -c .yamllint.yml
        language: system
        types: [yaml]
